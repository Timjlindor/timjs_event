<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="site-nav">
        <a class="brand" href="index.html"><img src="Timjs.PNG" alt="Timj">Timj Multi-Services</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="Decoration.html">Décoration</a>
            <a href="Photographie.html">Photographie</a>
            <a href="Premiers-Soins.html">Premiers soins</a>
            <a class="active" href="Snake.html">Jeu</a>
            <a class="cta-link" href="reservation.html">Réservation</a>
        </div>
    </nav>

    <div class="header">
        <h1>Jeu Snake</h1>
        <p>Utilisez les flèches ou WASD pour jouer</p>
    </div>

    <div class="game-wrap">
        <div class="game-header">
            <div>Score: <span id="score">0</span></div>
            <div class="status" id="status">En cours</div>
        </div>
        <canvas id="game" width="400" height="400" aria-label="Jeu Snake"></canvas>
        <div class="controls" aria-label="Contrôle tactile">
            <div></div>
            <button id="btn-up" type="button">Haut</button>
            <div></div>
            <button id="btn-left" type="button">Gauche</button>
            <button id="btn-down" type="button">Bas</button>
            <button id="btn-right" type="button">Droite</button>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="actions">
            <button id="btn-pause" type="button">Pause</button>
            <button id="btn-restart" type="button">Recommencer</button>
        </div>
    </div>

    <div class="back-link">
        <a href="index.html">Retour à l'accueil</a>
    </div>

    <script src="snake.js"></script>
    <script src="premium.js" defer></script>
</body>
</html>
