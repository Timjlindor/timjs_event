<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Adresse officielle du site : timjs-event.vercel.app.
         Les anciens liens GitHub Pages y sont redirigés automatiquement. -->
    <script>
        (function () {
            if (location.hostname !== "timjlindor.github.io") return;
            var p = location.pathname.replace(/^\/timjs_event/, "") || "/";
            location.replace("https://timjs-event.vercel.app" + p + location.search + location.hash);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - Timj Multi-Services</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="section" style="text-align:center; max-width:640px; margin:0 auto; padding:6rem 1.5rem;">
        <h1>Page introuvable</h1>
        <p>Désolé, cette page n'existe pas ou a été déplacée.</p>
        <p><a class="btn" href="/">Retour à l'accueil</a></p>
    </main>
</body>
</html>
