<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Décoration baby shower">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14120f"/>
      <stop offset="0.55" stop-color="#211e19"/>
      <stop offset="1" stop-color="#1c1a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#c9a24b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c9a24b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>
  <g fill="#c9a24b" opacity="0.3">
    <circle cx="150" cy="110" r="3"/><circle cx="1050" cy="130" r="3"/><circle cx="1000" cy="360" r="2.5"/>
  </g>
  <g transform="translate(600,200)" fill="none" stroke="#c9a24b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-30" y="-20" width="60" height="90" rx="16"/>
    <rect x="-14" y="-50" width="28" height="30" rx="8"/>
    <line x1="-20" y1="10" x2="20" y2="10"/>
    <line x1="-20" y1="30" x2="20" y2="30"/>
  </g>
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#f7f5f1" font-weight="bold">Baby Shower</text>
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#c9a24b" opacity="0.9">Douceur &amp; tendresse</text>
